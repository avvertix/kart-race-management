<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licence request form</title>
<!--
  PROTOTYPE (throwaway): three directions for the driver's Licence Request form.
  Question: how to mix the guidance of a wizard with the overview of a single page, on mobile,
  including the "changes requested" state where only flagged parts must be fixed.
  Switch variants with the bottom pill, 1–3 or ← →. Switch scenario with the yellow bar.
-->
<style>
  :root {
    --z50:#fafafa; --z100:#f4f4f5; --z200:#e4e4e7; --z300:#d4d4d8; --z400:#a1a1aa; --z500:#71717a;
    --z600:#52525b; --z700:#3f3f46; --z800:#27272a; --z900:#18181b;
    --o50:#fff7ed; --o200:#fed7aa; --o300:#fdba74; --o600:#ea580c; --o700:#c2410c;
    --g50:#f0fdf4; --g600:#16a34a; --g700:#15803d;
    --r50:#fef2f2; --r200:#fecaca; --r600:#dc2626; --r700:#b91c1c;
    --a50:#fffbeb; --a600:#d97706; --a700:#b45309;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--z100); color:var(--z900); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: 96px; }
  h1,h2,h3 { margin:0; font-weight:600; letter-spacing:-0.01em; }
  p { margin:0; }
  button { font: inherit; color: inherit; }

  /* harness: scenario bar */
  .scn { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#fde047; border-bottom:2px solid #ca8a04; padding:8px 16px; font-size:13px; }
  .scn b { margin-right:4px; }
  .scn button { border:1px solid #ca8a04; background:transparent; border-radius:999px; padding:4px 10px; cursor:pointer; }
  .scn button[aria-pressed="true"] { background:#18181b; color:#fff; border-color:#18181b; }

  /* app chrome */
  .app-top { background:#fff; border-bottom:1px solid var(--z200); }
  .app-top .in-w { display:flex; align-items:center; gap:20px; height:56px; padding:0 16px; max-width:1100px; margin:0 auto; }
  .logo { font-weight:800; font-size:13px; border:2px solid var(--z900); border-radius:6px; padding:3px 6px; }
  .app-nav { display:flex; gap:18px; font-size:14px; color:var(--z500); overflow:hidden; white-space:nowrap; }
  .app-nav .on { color:var(--z900); font-weight:600; }
  .avatar { margin-left:auto; width:32px; height:32px; border-radius:50%; background:var(--z200); display:grid; place-items:center; font-size:12px; font-weight:600; color:var(--z600); flex:none; }
  @media (max-width: 560px) { .app-nav span:not(.on) { display:none; } }

  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px; }
  .crumb { font-size:13px; color:var(--z500); margin-bottom:6px; }
  .head { display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px 16px; margin-bottom:16px; }
  .head h1 { font-size:22px; line-height:1.25; flex:1 1 260px; }
  .head .meta { font-size:13px; color:var(--z500); width:100%; }

  .pill { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .pill.draft { background:var(--z200); color:var(--z700); }
  .pill.changes { background:var(--r50); color:var(--r700); box-shadow: inset 0 0 0 1px var(--r200); }
  .pill.sent { background:var(--g50); color:var(--g700); }

  .card { background:#fff; border:1px solid var(--z200); border-radius:10px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .banner { display:flex; gap:12px; padding:14px 16px; border-radius:10px; margin-bottom:16px; font-size:14px; }
  .banner.red { background:var(--r50); box-shadow: inset 0 0 0 1px var(--r200); color:var(--r700); }
  .banner.info { background:#fff; box-shadow: inset 0 0 0 1px var(--z200); color:var(--z700); }
  .banner strong { color:inherit; }

  /* fields */
  .fields { display:grid; grid-template-columns: 1fr; gap:14px 16px; }
  @media (min-width: 640px) { .fields { grid-template-columns: 1fr 1fr; } .span2 { grid-column: span 2; } }
  .f label, .lbl { display:block; font-size:14px; font-weight:500; color:var(--z700); margin-bottom:6px; }
  .f .hint { font-size:13px; color:var(--z500); margin-top:4px; }
  .in { width:100%; height:44px; padding:0 12px; border:1px solid var(--z300); border-radius:6px; background:#fff; font-size:16px; color:var(--z900); transition: border-color 150ms ease-out, box-shadow 150ms ease-out; }
  select.in { appearance:none; background-image: linear-gradient(45deg, transparent 50%, var(--z500) 50%), linear-gradient(135deg, var(--z500) 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size:5px 5px; background-repeat:no-repeat; padding-right:32px; }
  .in:focus { outline:none; border-color: var(--o300); box-shadow: 0 0 0 3px rgba(254,215,170,.6); }
  .in.bad { border-color: var(--r600); }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .opt { position:relative; display:flex; align-items:center; gap:10px; min-height:44px; padding:10px 14px; border:1px solid var(--z300); border-radius:8px; background:#fff; cursor:pointer; font-size:15px; transition: border-color 150ms ease-out, background-color 150ms ease-out; }
  .opt input { accent-color: var(--o600); width:18px; height:18px; margin:0; }
  .opt:has(input:checked) { border-color: var(--z900); background: var(--z50); box-shadow: inset 0 0 0 1px var(--z900); }
  .opt:has(input:focus-visible) { box-shadow: 0 0 0 3px rgba(254,215,170,.8); }
  .products { display:grid; gap:10px; }
  .product { align-items:flex-start; }
  .product .t { font-weight:600; }
  .product .d { font-size:13px; color:var(--z500); }
  .product .p { margin-left:auto; font-weight:600; white-space:nowrap; font-variant-numeric: tabular-nums; }
  .product .tag { display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--o700); background:var(--o50); border-radius:4px; padding:1px 6px; margin-bottom:2px; }
  .note { font-size:13px; color:var(--z600); background:var(--z50); border:1px solid var(--z200); border-radius:8px; padding:10px 12px; }

  /* buttons */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:6px; border:1px solid transparent; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; transition: background-color 150ms ease-out, transform 100ms ease-out; white-space:nowrap; }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:focus-visible { outline:none; box-shadow: 0 0 0 3px var(--z300); }
  .btn.primary { background:var(--z900); color:#fff; }
  .btn.primary:hover { background:var(--z700); }
  .btn.secondary { background:#fff; border-color:var(--z300); color:var(--z800); }
  .btn.secondary:hover { background:var(--z50); }
  .btn.ghost { background:transparent; color:var(--z600); padding:0 10px; }
  .btn.ghost:hover { background:var(--z100); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.sm { min-height:36px; font-size:13px; padding:0 12px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:20px; }
  .actions .spacer { flex:1; }

  /* status dot */
  .st { flex:none; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; }
  .st.todo { box-shadow: inset 0 0 0 2px var(--z300); color:var(--z500); }
  .st.cur { box-shadow: inset 0 0 0 2px var(--z900); color:var(--z900); }
  .st.done, .st.fixed { background:var(--g600); color:#fff; }
  .st.flagged { background:var(--r600); color:#fff; }
  .st.accepted { background:var(--z200); color:var(--z600); }
  .st.later { background:var(--a50); color:var(--a700); box-shadow: inset 0 0 0 2px var(--a600); }
  .st svg { width:14px; height:14px; }
  .tag-st { font-size:12px; font-weight:600; }
  .tag-st.done, .tag-st.fixed { color:var(--g700); }
  .tag-st.flagged { color:var(--r700); }
  .tag-st.accepted { color:var(--z500); }
  .tag-st.later { color:var(--a700); }
  .tag-st.todo { color:var(--z500); }

  /* flag note */
  .flag { display:flex; gap:10px; background:var(--r50); color:var(--r700); border-radius:8px; padding:10px 12px; font-size:14px; margin-bottom:14px; box-shadow: inset 0 0 0 1px var(--r200); }
  .flag.ok { background:var(--g50); color:var(--g700); box-shadow: inset 0 0 0 1px #bbf7d0; }
  .flag b { white-space:nowrap; }

  /* documents */
  .docs { display:grid; gap:10px; }
  .doc { display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; padding:12px; border:1px solid var(--z200); border-radius:8px; }
  .doc.flagged { border-color: var(--r200); background: #fffafa; }
  .doc .dn { flex:1 1 220px; min-width:0; }
  .doc .dn .t { font-weight:500; overflow-wrap:anywhere; }
  .doc .dn .s { font-size:13px; color:var(--z500); overflow-wrap:anywhere; }
  .doc .dn .s.flagged { color:var(--r700); }
  .doc .da { display:flex; gap:8px; flex-wrap:wrap; }
  .upl { position:relative; overflow:hidden; }
  .upl input { position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0; }
  .upl:has(input:focus-visible) { box-shadow: 0 0 0 3px var(--z300); }
  .group-t { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--z500); margin:6px 0 2px; }

  dl.sum { display:grid; grid-template-columns: max-content 1fr; gap:4px 16px; margin:0; font-size:14px; }
  dl.sum dt { color:var(--z500); }
  dl.sum dd { margin:0; overflow-wrap:anywhere; }
  .locked-note { font-size:13px; color:var(--z500); display:flex; gap:6px; align-items:center; margin-top:10px; }

  /* ====== V1 accordion stepper ====== */
  .acc { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .acc > li { overflow:hidden; }
  .acc-h { width:100%; display:flex; align-items:center; gap:12px; padding:14px 16px; background:none; border:0; text-align:left; cursor:pointer; min-height:64px; }
  .acc-h:focus-visible { outline:none; box-shadow: inset 0 0 0 3px var(--o200); border-radius:10px; }
  .acc-h .tx { flex:1; min-width:0; }
  .acc-h .tt { font-weight:600; }
  .acc-h .ss { font-size:13px; color:var(--z500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acc-h .chev { flex:none; color:var(--z400); transition: transform 200ms var(--ease); }
  .acc li.open .chev { transform: rotate(180deg); }
  .acc li.open { border-color: var(--z300); box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  .acc li.flagged-li { border-color: var(--r200); }
  .acc-b { padding: 4px 16px 18px 56px; animation: fadeIn 220ms var(--ease); }
  @media (max-width: 560px) { .acc-b { padding-left:16px; } }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-4px); } to { opacity:1; transform:none; } }

  /* ====== V2 step screens ====== */
  .v2 { max-width: 640px; margin: 0 auto; padding: 16px 16px 120px; }
  .v2-top { position: sticky; top:0; z-index:5; background: rgba(244,244,245,.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); margin: 0 -16px; padding: 10px 16px 12px; border-bottom:1px solid var(--z200); }
  .v2-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:13px; color:var(--z500); }
  .v2-row .grow { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .segs { display:flex; gap:4px; }
  .segs button { flex:1; height:24px; padding:0; border:0; background:none; cursor:pointer; display:flex; align-items:center; }
  .segs button span { display:block; width:100%; height:6px; border-radius:3px; background:var(--z300); transition: background-color 150ms ease-out, height 150ms var(--ease); }
  .segs button.done span, .segs button.fixed span { background:var(--g600); }
  .segs button.flagged span { background:var(--r600); }
  .segs button.accepted span { background:var(--z400); }
  .segs button.later span { background:var(--a600); }
  .segs button.cur span { height:10px; box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--z900); }
  .segs button:focus-visible span { box-shadow: 0 0 0 3px var(--o300); }
  .v2-screen { padding-top: 20px; animation: slideIn 240ms var(--ease); }
  @keyframes slideIn { from { opacity:0; transform: translateX(12px); } to { opacity:1; transform:none; } }
  .v2-screen h2 { font-size:22px; margin-bottom:4px; }
  .v2-screen .lead { color:var(--z500); font-size:14px; margin-bottom:18px; }
  .v2-bar { position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--z200); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); padding-bottom: 76px; }
  .v2-bar .in-w { max-width:640px; margin:0 auto; display:flex; gap:8px; align-items:center; }
  .v2-bar .grow { flex:1; }
  .v2-bar .saved { font-size:12px; color:var(--z500); }
  .sheet-bg { position:fixed; inset:0; background:rgba(24,24,27,.4); z-index:20; animation: fade 200ms ease-out; }
  @keyframes fade { from { opacity:0 } }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:#fff; border-radius:16px 16px 0 0; padding: 8px 16px 96px; max-height:80vh; overflow:auto; animation: up 280ms var(--ease); }
  @media (min-width: 700px) { .sheet { left:50%; width:560px; transform: translateX(-50%); bottom:auto; top:10vh; border-radius:14px; padding-bottom:16px; animation: fade 200ms ease-out; } }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet .grab { width:36px; height:4px; border-radius:2px; background:var(--z300); margin: 4px auto 12px; }
  .sheet-row { width:100%; display:flex; align-items:center; gap:12px; padding:12px 4px; border:0; border-bottom:1px solid var(--z100); background:none; text-align:left; cursor:pointer; min-height:56px; }
  .sheet-row:hover { background:var(--z50); }
  .sheet-row .tx { flex:1; min-width:0; }
  .sheet-row .ss { font-size:13px; color:var(--z500); }
  @media (prefers-reduced-motion: reduce) { .sheet, .v2-screen, .acc-b, .sheet-bg { animation: none; } }

  /* ====== V3 long form ====== */
  .v3 { max-width: 1060px; margin:0 auto; padding: 20px 16px; display:grid; grid-template-columns: 1fr; gap:24px; }
  @media (min-width: 920px) { .v3 { grid-template-columns: 240px 1fr; } }
  .v3-side { display:none; }
  @media (min-width: 920px) { .v3-side { display:block; position:sticky; top:16px; align-self:start; } }
  .v3-side .card { padding:12px; }
  .v3-side a { display:flex; align-items:center; gap:10px; padding:8px; border-radius:6px; text-decoration:none; color:var(--z800); font-size:14px; }
  .v3-side a:hover { background:var(--z100); }
  .v3-side a .st { width:22px; height:22px; font-size:11px; }
  .v3-side .prog { font-size:13px; color:var(--z500); padding: 4px 8px 10px; }
  .bar { height:6px; background:var(--z200); border-radius:3px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:var(--g600); border-radius:3px; transition: width 300ms var(--ease); }
  .v3-chips { position:sticky; top:0; z-index:5; margin: 0 -16px 4px; padding: 10px 16px; background: rgba(244,244,245,.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom:1px solid var(--z200); }
  @media (min-width: 920px) { .v3-chips { display:none; } }
  .chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-top:8px; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px 0 6px; border-radius:999px; background:#fff; border:1px solid var(--z200); text-decoration:none; color:var(--z800); font-size:13px; font-weight:500; }
  .chip .st { width:20px; height:20px; font-size:10px; }
  .chip .st svg { width:11px; height:11px; }
  .v3-sec { padding:18px 16px 20px; scroll-margin-top: 110px; }
  @media (min-width: 640px) { .v3-sec { padding: 22px 24px 24px; } }
  .v3-sec.flagged { border-color: var(--r200); box-shadow: 0 0 0 3px var(--r50); }
  .v3-sec-h { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .v3-sec-h h2 { font-size:17px; flex:1; }
  .v3-sec-h .saved { font-size:12px; color:var(--z500); white-space:nowrap; }
  .v3-main { display:grid; gap:14px; min-width:0; }

  .success { text-align:center; padding:40px 20px; }
  .success .big { width:56px; height:56px; border-radius:50%; background:var(--g600); color:#fff; display:grid; place-items:center; margin:0 auto 14px; }

  /* picker: verbatim spec */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>

<div class="scn" role="group" aria-label="Prototype scenario">
  <b>Scenario</b>
  <button data-scn="fresh">Fresh draft</button>
  <button data-scn="partial">Half done, underage holder</button>
  <button data-scn="changes">Changes requested</button>
</div>

<header class="app-top"><div class="in-w">
  <span class="logo">KRM</span>
  <nav class="app-nav"><span>Races</span><span class="on">Licences</span><span>Drivers and competitors</span></nav>
  <span class="avatar" aria-hidden="true">GB</span>
</div></header>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Accordion stepper</button>
  <button class="proto-picker-item">Step screens</button>
  <button class="proto-picker-item">Long form, autosave</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
/* ---------------- data ---------------- */
const TODAY = new Date('2026-10-26');
const PRODUCTS = [
  { id:'aci', provider:'ACI', title:'ACI karting licence 2027', desc:'Emission or renewal of a driver licence.', price:180 },
  { id:'aci-pack', provider:'ACI', tag:'Promotion', title:'ACI 2027 package: licence, first race and race number', desc:'Includes one race fee in Trofeo Karting Lombardia 2027 and the right to reserve your race number when you enroll.', price:260 },
  { id:'asi', provider:'ASI', title:'ASI karting licence 2027', desc:'Emission or renewal of a driver licence.', price:120 },
];
const SUBTYPES = {
  national: ['C Junior', 'C Senior', 'Under 14 (60 Mini)', 'Cadetti'],
  international: ['International C', 'International B'],
  ASI: ['Kart agonistica', 'Kart promozionale'],
};
const HOLDER_FIELDS = [
  ['first_name','First name',{auto:'given-name'}],
  ['last_name','Last name',{auto:'family-name'}],
  ['sex','Sex',{options:[['','Choose…'],['F','Female'],['M','Male']]}],
  ['birth_date','Date of birth',{type:'date',auto:'bday'}],
  ['birth_place','Place of birth',{}],
  ['fiscal_code','Fiscal code',{hint:'16 characters, as on the health card.', upper:true}],
  ['nationality','Nationality',{}],
  ['email','Email',{type:'email',auto:'email',mode:'email'}],
  ['phone','Phone',{type:'tel',auto:'tel',mode:'tel'}],
  ['street','Residence address',{auto:'street-address',span:2,hint:'Street and house number.'}],
  ['city','City',{auto:'address-level2'}],
  ['postal_code','Postal code',{auto:'postal-code',mode:'numeric'}],
  ['province','Province',{}],
];
const PARENT_FIELDS = HOLDER_FIELDS.filter(f => !['street','city','postal_code','province'].includes(f[0]));

    const acts = s.id === 'review' || !editable(s.id) ? '' :
      `<div class="actions"><button class="btn primary" data-act="v1next" data-id="${s.id}">${next ? (s.id === 'payment' && !complete('payment') ? 'Pay later, continue' : 'Save and continue') : 'Save'}</button>${next ? `<span class="spacer"></span><span class="tag-st" style="color:var(--z500)">Saved as draft</span>` : ''}</div>`;
    return `<li class="card ${open ? 'open' : ''} ${st === 'flagged' ? 'flagged-li' : ''}">
      <button class="acc-h" data-act="v1open" data-id="${s.id}" aria-expanded="${open}" aria-controls="v1b_${s.id}">${stDot(s.id, i + 1, open)}<span class="tx"><span class="tt">${s.title}</span><span class="ss" style="display:block">${open ? s.lead : `<span class="tag-st ${st}">${LABEL[st]}</span> · ${esc(summary(s.id))}`}</span></span><span class="chev">${ICON.chev}</span></button>
      ${open ? `<div class="acc-b" id="v1b_${s.id}">${body(s.id)}${acts}</div>` : ''}
    </li>`;
  }).join('') + `</ol></div>`;
}

/* ---------------- VARIANT 2: step screens ---------------- */
function v2list() {
  const secs = sections();
  if (changesMode() && ui.v2fix) return secs.filter(s => flagsOf(s.id).length || s.id === 'review');
  return secs;
}
function v2() {
  if (S.submitted) return successView();
  const list = v2list();
  if (ui.v2step >= list.length) ui.v2step = list.length - 1;
  if (ui.v2step < 0) ui.v2step = 0;
  const s = list[ui.v2step];
  const all = sections();
  const isLast = ui.v2step === list.length - 1;
  const fixInfo = changesMode() ? `<div class="banner red" style="margin:14px 0 0" role="status">${ICON.bang}<div><strong>${ui.v2fix ? `Fix mode: ${list.length - 1} sections to fix` : 'Showing every section'}</strong> · <button class="btn ghost sm" style="color:inherit;text-decoration:underline;padding:0;min-height:0" data-act="v2fixtoggle">${ui.v2fix ? 'Show all sections' : 'Only what needs fixing'}</button></div></div>` : '';
  const nextLabel = s.id === 'payment' && !complete('payment') && !changesMode() ? 'Pay later' : 'Save and continue';
  return `<div class="v2">
    <div class="v2-top">
      <div class="v2-row"><span class="grow">${esc(fullName(S.holder) || 'New licence request')} · ${S.submitted ? 'Submitted' : changesMode() ? 'Changes requested' : 'Draft'}</span><button class="btn ghost sm" data-act="v2sheet" aria-haspopup="dialog">All sections</button></div>
      <div class="segs" role="tablist" aria-label="Sections">${list.map((x, i) => `<button role="tab" aria-selected="${i === ui.v2step}" aria-label="${x.title}: ${LABEL[status(x.id)]}" title="${x.title}" class="${status(x.id)} ${i === ui.v2step ? 'cur' : ''}" data-act="v2go" data-i="${i}"><span></span></button>`).join('')}</div>
    </div>
    ${fixInfo}
    <section class="v2-screen" aria-labelledby="v2h">
      <p style="font-size:13px;color:var(--z500);margin-bottom:4px">Step ${ui.v2step + 1} of ${list.length}${changesMode() ? '' : ` · <span class="tag-st ${status(s.id)}">${LABEL[status(s.id)]}</span>`}</p>
      <h2 id="v2h">${s.title}</h2>
      <p class="lead">${s.lead}</p>
      ${body(s.id)}
    </section>
  </div>
  <div class="v2-bar"><div class="in-w">
    <button class="btn secondary" data-act="v2prev" ${ui.v2step === 0 ? 'disabled' : ''}>Back</button>
    <span class="grow"><span class="saved">Saved as draft</span></span>
    ${isLast ? '' : `<button class="btn primary" data-act="v2next">${editable(s.id) ? nextLabel : 'Next'}</button>`}
  </div></div>
  ${ui.v2sheet ? `<div class="sheet-bg" data-act="v2sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="All sections"><div class="grab"></div><h2 style="font-size:17px;margin-bottom:6px">All sections</h2>${all.map((x, i) => `<button class="sheet-row" data-act="v2jump" data-id="${x.id}">${stDot(x.id, i + 1, x.id === s.id)}<span class="tx"><span style="font-weight:600">${x.title}</span><br><span class="ss"><span class="tag-st ${status(x.id)}">${LABEL[status(x.id)]}</span> · ${esc(summary(x.id))}</span></span></button>`).join('')}</div>` : ''}`;
}

/* ---------------- VARIANT 3: long form, autosave ---------------- */
function v3nav() {
  const secs = sections().filter(s => s.id !== 'review');
  const done = secs.filter(s => ['done','fixed','accepted'].includes(status(s.id))).length;
  return { secs, done, pct: Math.round(done / secs.length * 100) };
}
function v3side() {
  const { secs, done, pct } = v3nav();
  return `<div class="card"><p class="prog"><b style="color:var(--z900)">${done} of ${secs.length}</b> sections ${changesMode() ? 'accepted or fixed' : 'complete'}<span class="bar"><i style="width:${pct}%"></i></span></p>${sections().map((s, i) => `<a href="#v3_${s.id}">${stDot(s.id, i + 1)}<span>${s.title}</span></a>`).join('')}</div>`;
}
function v3chips() {
  const { secs, done, pct } = v3nav();
  return `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--z500)"><span><b style="color:var(--z900)">${done} of ${secs.length}</b> ${changesMode() ? 'accepted or fixed' : 'complete'}</span><span>Saved automatically</span></div><span class="bar"><i style="width:${pct}%"></i></span><div class="chips">${sections().map((s, i) => `<a class="chip" href="#v3_${s.id}">${stDot(s.id, i + 1)}${s.title}</a>`).join('')}</div>`;
}
function v3() {
  if (S.submitted) return successView();
  const secs = sections();
  const ordered = changesMode() ? [...secs.filter(s => flagsOf(s.id).length), ...secs.filter(s => !flagsOf(s.id).length && s.id !== 'review'), secs.at(-1)] : secs;
  return `<div class="v3"><aside class="v3-side" id="v3side">${v3side()}</aside><div class="v3-main">
    <div>${pageHead()}${changesBanner()}</div>
    <div class="v3-chips" id="v3chips">${v3chips()}</div>
    ${changesMode() ? '<p class="group-t" style="margin:4px 0 -4px">To fix</p>' : ''}
    ${ordered.map((s, i) => {
      const st = status(s.id);
      const divider = changesMode() && i > 0 && !flagsOf(s.id).length && flagsOf(ordered[i - 1].id).length && s.id !== 'review' ? '<p class="group-t" style="margin:10px 0 -4px">Accepted</p>' : '';
      return divider + `<section class="card v3-sec ${st === 'flagged' ? 'flagged' : ''}" id="v3_${s.id}" aria-labelledby="v3h_${s.id}">
        <div class="v3-sec-h">${stDot(s.id, secs.indexOf(s) + 1)}<h2 id="v3h_${s.id}">${s.title}</h2><span class="saved" data-saved="${s.id}">${s.id === 'review' || !editable(s.id) ? '' : S.savedAt[s.id] ? 'Saved ' + S.savedAt[s.id] : ''}</span></div>
        ${editable(s.id) ? `<p style="font-size:14px;color:var(--z500);margin:-8px 0 16px">${s.lead}</p>` : ''}
        ${body(s.id)}
      </section>`;
    }).join('')}
  </div></div>`;
}
function v3chrome() {
  const side = document.getElementById('v3side'); if (side) side.innerHTML = v3side();
  const chips = document.getElementById('v3chips'); if (chips) chips.innerHTML = v3chips();
  document.querySelectorAll('.v3-sec').forEach(sec => {
    const id = sec.id.replace('v3_', '');
    const dot = sec.querySelector('.v3-sec-h .st'); if (dot) dot.outerHTML = stDot(id, sections().findIndex(s => s.id === id) + 1);
    sec.classList.toggle('flagged', status(id) === 'flagged');
  });
}

/* ---------------- wiring ---------------- */
const variants = [v1, v2, v3];
const stage = document.getElementById('stage');
function rerender() { const y = scrollY; stage.innerHTML = variants[current](); scrollTo(0, y); syncScn(); }
function syncScn() { document.querySelectorAll('[data-scn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.scn === S.scenario)); }
const sectionOf = (el) => el.closest('[id^="v3_"]')?.id.replace('v3_', '') || el.closest('[id^="v1b_"]')?.id.replace('v1b_', '') || v2list()[ui.v2step]?.id;
function markSaved(id) {
  S.savedAt[id] = 'just now';
  if (S.flags[id]) S.resolved[id] = true;
}
const STRUCTURAL = ['holder.birth_date', 'level', 'subtype', 'declared'];

document.addEventListener('input', (e) => {
  const el = e.target; if (!el.dataset?.path) return;
  if (el.type === 'radio' || el.type === 'checkbox' || el.tagName === 'SELECT') return;
  set(el.dataset.path, el.dataset.path.endsWith('fiscal_code') ? el.value.toUpperCase() : el.value);
  if (current === 2) { const s = el.closest('[data-saved]') || document.querySelector(`[data-saved="${sectionOf(el)}"]`); if (s) s.textContent = 'Saving…'; }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.matches('[data-pick-product]')) {
    if (S.order && S.product !== el.value) { S.cancelled = S.order.ref; S.orderSeq++; }
    S.product = el.value; S.level = ''; S.subtype = ''; S.subtype_other = '';
    S.order = { ref: 'KRM-2027-0' + S.orderSeq, amount: product().price, paid:false, proof:null };
    markSaved('product'); return rerender();
  }
  if (el.dataset?.upload) {
    const name = el.files?.[0]?.name || 'file.pdf';
    if (el.dataset.upload === '__proof') S.order.proof = name; else { S.uploads[el.dataset.upload] = name; S.resolved['doc:' + el.dataset.upload] = S.flags['doc:' + el.dataset.upload] ? true : undefined; }
    markSaved(sectionOf(el)); return rerender();
  }
  if (!el.dataset?.path) return;
  const path = el.dataset.path;
  set(path, el.type === 'checkbox' ? el.checked : el.value);
  if (path === 'level') S.subtype = '';
  if (current === 2) {
    const id = sectionOf(el); markSaved(id);
    if (STRUCTURAL.includes(path)) return rerender();
    const s = document.querySelector(`[data-saved="${id}"]`); if (s) s.textContent = 'Saved just now';
    v3chrome();
  } else if (STRUCTURAL.includes(path)) rerender();
});
document.addEventListener('click', (e) => {
  const scn = e.target.closest('[data-scn]');
  if (scn) { S = scenario(scn.dataset.scn); ui.v1open = null; ui.v2step = 0; ui.v2fix = true; ui.v2sheet = false; return rerender(); }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'noop') { e.preventDefault(); return; }
  if (a === 'v1open') { ui.v1open = ui.v1open === b.dataset.id ? '' : b.dataset.id; return rerender(); }
  if (a === 'v1next') {
    markSaved(b.dataset.id);
    const secs = sections(); const i = secs.findIndex(s => s.id === b.dataset.id);
    const nxt = changesMode() ? secs.slice(i + 1).find(s => status(s.id) === 'flagged') || secs.at(-1) : secs.slice(i + 1).find(s => status(s.id) !== 'done' && !(s.id === 'payment' && S.order)) || secs.at(-1);
    ui.v1open = nxt.id; rerender();
    document.querySelector(`[data-act="v1open"][data-id="${nxt.id}"]`)?.scrollIntoView({ block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    return;
  }
  if (a === 'v2go') { ui.v2step = +b.dataset.i; rerender(); return scrollTo(0, 0); }
  if (a === 'v2next') { const id = v2list()[ui.v2step].id; if (editable(id)) markSaved(id); ui.v2step++; rerender(); return scrollTo(0, 0); }
  if (a === 'v2prev') { ui.v2step--; rerender(); return scrollTo(0, 0); }
  if (a === 'v2sheet') { ui.v2sheet = !ui.v2sheet; return rerender(); }
  if (a === 'v2jump') { ui.v2fix = false; ui.v2step = sections().findIndex(s => s.id === b.dataset.id); ui.v2sheet = false; rerender(); return scrollTo(0, 0); }
  if (a === 'v2fixtoggle') { const id = v2list()[ui.v2step].id; ui.v2fix = !ui.v2fix; ui.v2step = Math.max(0, v2list().findIndex(s => s.id === id)); return rerender(); }
  if (a === 'add-parent2') { S.parent2 = { nationality:'Italian' }; return rerender(); }
  if (a === 'rm-parent2') { S.parent2 = null; delete S.uploads.id_parent2; return rerender(); }
  if (a === 'submit') { S.submitted = true; rerender(); return scrollTo(0, 0); }
  if (a === 'unsubmit') { S.submitted = false; return rerender(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ui.v2sheet) { ui.v2sheet = false; rerender(); } });

/* picker: reference wiring */
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); syncScn(); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  ui.v2sheet = false;
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
