name: Fix PHP code style issues

on:
  push:
    paths:
      - '**.php'
      - .github/workflows/fix-php-code-style-issues.yml

permissions:
  contents: write

jobs:
  php-code-styling:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: Install Pint version from composer.lock
        run: |
          PINT_VERSION=$(composer show --locked laravel/pint --format=json | jq -r '.versions[0]')
          echo "Installing laravel/pint ${PINT_VERSION}"
          composer global require "laravel/pint:${PINT_VERSION}" --no-progress --no-interaction
          echo "$(composer global config bin-dir --absolute --quiet)" >> "$GITHUB_PATH"

      - name: Fix PHP code style issues
        run: pint

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2
        with:
          commit_message: Fix styling
